# Electron engine upgrades are owned by the maintainer's Update engine workflow.
# Dependabot still updates packaging tools and other dependencies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: electron
    groups:
      electron-tools:
        patterns: ["electron-builder", "electron-updater"]
      capacitor:
        patterns: ["@capacitor/*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    # The Gradle major follows the Android Gradle plugin of Capacitor's Android project (8.x needs Gradle 8):
    # move it with a Capacitor upgrade, not alone.
    ignore:
      - dependency-name: gradle-wrapper
        update-types: ["version-update:semver-major"]
